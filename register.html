<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — CodeBloomAfrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="register.css">
</head>
<body>

<div class="reg-page">

  <div class="reg-form-col">
    <a href="index.html" class="logo reg-logo">
      <img src="images/image1.png" alt="CodeBloomAfrica logo">
      CodeBloomAfrica
    </a>

    <div class="reg-form-wrap">
      <span class="eyebrow">◆ Register</span>
      <h1>Start your tech journey.</h1>
      <p class="reg-sub">Fill in your details below, then proceed to payment to secure your spot.</p>

      <form id="registrationForm" class="reg-form" novalidate>
        <div class="reg-row">
          <div class="reg-field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
          </div>
          <div class="reg-field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="reg-field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="jane@email.com" required>
        </div>

        <div class="reg-field">
          <label for="phone">Phone number <span class="reg-hint">(preferably WhatsApp)</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+234 800 000 0000" required>
        </div>

        <div class="reg-field">
          <label for="course">Course</label>
          <select id="course" name="course" required>
            <option value="" disabled selected>Select a course</option>
            <option value="Web Development">Web Development</option>
            <option value="UI/UX Design">UI/UX Design</option>
            <option value="AI Video Creation">AI Video Creation</option>
            <option value="Data Analysis">Data Analysis</option>
            <option value="Product Management">Product Management</option>
            <option value="Digital Marketing">Digital Marketing</option>
          </select>
        </div>

        <div class="reg-field">
          <label for="workStatus">Current Work Status</label>
          <select id="workStatus" name="workStatus" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Student">Student</option>
            <option value="Graduate">Graduate</option>
            <option value="NYSC Corper">NYSC Corper</option>
            <option value="Working Professional (Employed)">Working Professional (Employed)</option>
            <option value="Self Employed">Self Employed</option>
            <option value="Unemployed">Unemployed</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="reg-field">
          <label for="education">Education</label>
          <select id="education" name="education" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Secondary School">Secondary School</option>
            <option value="OND/NCE">OND/NCE</option>
            <option value="HND">HND</option>
            <option value="Bachelor's Degree">Bachelor's Degree</option>
            <option value="Postgraduate">Postgraduate</option>
          </select>
        </div>

        <div class="reg-field">
          <label for="stateOfResidence">Location (State of Residence)</label>
          <select id="stateOfResidence" name="stateOfResidence" required>
            <option value="" disabled selected>State of Residence</option>
            <option value="Abuja">FCT Abuja</option>
            <option value="Abia">Abia</option>
            <option value="Adamawa">Adamawa</option>
            <option value="Akwa Ibom">Akwa Ibom</option>
            <option value="Anambra">Anambra</option>
            <option value="Bauchi">Bauchi</option>
            <option value="Bayelsa">Bayelsa</option>
            <option value="Benue">Benue</option>
            <option value="Borno">Borno</option>
            <option value="Cross River">Cross River</option>
            <option value="Delta">Delta</option>
            <option value="Ebonyi">Ebonyi</option>
            <option value="Edo">Edo</option>
            <option value="Ekiti">Ekiti</option>
            <option value="Enugu">Enugu</option>
            <option value="Gombe">Gombe</option>
            <option value="Imo">Imo</option>
            <option value="Jigawa">Jigawa</option>
            <option value="Kaduna">Kaduna</option>
            <option value="Kano">Kano</option>
            <option value="Katsina">Katsina</option>
            <option value="Kebbi">Kebbi</option>
            <option value="Kogi">Kogi</option>
            <option value="Kwara">Kwara</option>
            <option value="Lagos">Lagos</option>
            <option value="Nasarawa">Nasarawa</option>
            <option value="Niger">Niger</option>
            <option value="Ogun">Ogun</option>
            <option value="Ondo">Ondo</option>
            <option value="Osun">Osun</option>
            <option value="Oyo">Oyo</option>
            <option value="Plateau">Plateau</option>
            <option value="Rivers">Rivers</option>
            <option value="Sokoto">Sokoto</option>
            <option value="Taraba">Taraba</option>
            <option value="Yobe">Yobe</option>
            <option value="Zamfara">Zamfara</option>
          </select>
        </div>

        <div class="reg-field">
          <label for="dateOfBirth">Date of Birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" required>
        </div>

        <div class="reg-field">
          <label for="awareBeginnerCourse">Are you aware this is a beginner's course?</label>
          <select id="awareBeginnerCourse" name="awareBeginnerCourse" required>
            <option value="Yes" selected>Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="reg-field">
          <label for="volunteeringInterest">Are you interested in volunteering with CodeBloom Africa to gain practical experience?</label>
          <select id="volunteeringInterest" name="volunteeringInterest" required>
            <option value="Yes" selected>Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <p id="formError" class="reg-error" hidden></p>

        <button type="submit" class="btn btn-dark reg-submit" id="submitBtn">
          <span id="submitLabel">Proceed to payment</span> <span class="arrow">→</span>
        </button>
      </form>
    </div>
  </div>

  <div class="reg-flyer-col">
    <img src="images/Future 500 cohort flyer.webp" alt="CodeBloomAfrica cohort flyer">
  </div>

</div>

<div id="paymentOverlay" class="payment-overlay">
  <div class="payment-overlay-spinner"></div>
  <p class="payment-overlay-text" id="paymentOverlayText">Confirming your payment…</p>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="register.js"></script>
</body>
</html>
