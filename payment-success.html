<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Status — CodeBloomAfrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="register.css">
<link rel="stylesheet" href="payment-success.css">
</head>
<body>

<div class="status-page">
  <a href="index.html" class="logo status-logo">
    <img src="images/image1.png" alt="CodeBloomAfrica logo">
    CodeBloomAfrica
  </a>

  <div class="status-card" id="statusCard">
    <div class="status-spinner" id="statusSpinner"></div>
    <h1 id="statusTitle">Confirming your payment…</h1>
    <p id="statusMessage" class="status-message">
      Please hold on while we verify your transaction with Paystack. Don't close this page.
    </p>
    <div id="statusActions" class="status-actions" hidden></div>
  </div>
</div>

<script src="payment-success.js"></script>
</body>
</html>
